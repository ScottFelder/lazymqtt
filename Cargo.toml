[package]
name = "lazymqtt"
version = "0.1.3"
edition = "2021"
rust-version = "1.74"
authors = ["Scott Felder <scott.felder@gmail.com>"]
description = "A fast terminal UI MQTT client, inspired by MQTT Explorer."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ScottFelder/lazymqtt"
homepage = "https://github.com/ScottFelder/lazymqtt"
keywords = ["mqtt", "tui", "terminal", "cli", "iot"]
categories = ["command-line-utilities", "network-programming"]
# Keep the published crate lean — the demo GIFs and CI config aren't needed to build.
exclude = ["assets/", ".github/", "*.gif"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rumqttc = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
